site_name: Secure Service Agent
site_description: A telecom support agent built on the assumption that the user is hostile.
repo_url: https://github.com/zarreh/secure_service_agent
edit_uri: edit/main/docs/

# Internal build-planning documents live alongside the site source in docs/ but
# are not part of the published site — see NOTICE.md.
exclude_docs: |
  PLAN.md
  HARVEST.md
  generate_plots.py
  assets/plot_style.mplstyle

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
  - Run it yourself: run-it-yourself.md
