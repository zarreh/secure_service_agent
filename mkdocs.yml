site_name: Secure Service Agent
site_description: Telecom customer support behind a full security envelope
repo_url: https://github.com/zarreh/secure_service_agent
edit_uri: edit/main/docs/

exclude_docs: |
  PLAN.md
  HARVEST.md
  generate_plots.py
  assets/plot_style.mplstyle

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decisions:
          - Index: architecture/decisions/index.md
          - D-A4-1 Independent synthetic accounts: architecture/decisions/D-A4-1-independent-synthetic-accounts.md
          - D-A4-2 PBKDF2 PIN hashing: architecture/decisions/D-A4-2-pbkdf2-pin-hashing.md
          - D-A4-3 Deterministic layer wins: architecture/decisions/D-A4-3-deterministic-layer-wins.md
          - D-A4-4 Persistent lockout counter: architecture/decisions/D-A4-4-persistent-lockout-counter.md
  - Evidence:
      - Evaluation: evidence/evaluation.md
